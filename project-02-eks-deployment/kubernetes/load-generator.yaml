apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: wordpress
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
      args:
        - |
          for i in $(seq 1 40); do
            while true; do
              wget -q -O- http://wordpress >/dev/null 2>&1
            done &
          done
          wait
