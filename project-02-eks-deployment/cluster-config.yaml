apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: enterprise-cluster
  region: us-east-1
  version: "1.36"

availabilityZones:
  - us-east-1a
  - us-east-1b

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    privateNetworking: false
    volumeSize: 20
    ssh:
      allow: false
